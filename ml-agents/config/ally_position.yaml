# AllyPosition: 17 vector observations, 4 continuous actions (dist, retreat, strafeDir, strafeIntensity).
# Unity prefab Behavior Parameters must match these dimensions.
behaviors:
  AllyPosition:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    threaded: false

environment_parameters:
  curriculum_level:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: progress
          behavior: AllyPosition
          threshold: 0.1
          min_lesson_length: 15000
          signal_smoothing: true
        value: 0
      - name: Lesson1
        completion_criteria:
          measure: progress
          behavior: AllyPosition
          threshold: 0.12
          min_lesson_length: 30000
          signal_smoothing: true
        value: 1
      - name: Lesson2
        completion_criteria:
          measure: progress
          behavior: AllyPosition
          threshold: 0.12
          min_lesson_length: 50000
          signal_smoothing: true
        value: 2
      - name: Lesson3
        completion_criteria:
          measure: progress
          behavior: AllyPosition
          threshold: 0.1
          min_lesson_length: 75000
          signal_smoothing: true
        value: 3
      - name: Lesson4
        value: 4
